  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #111827;
      --text-muted: #4b5563;
      --border: #e5e7eb;
      --card-bg: #ffffff;
      --card-hover-border: #9ca3af;
      --card-thumb-bg: #f9fafb;
      --link: #1d4ed8;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 56px 24px 80px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      margin-bottom: 36px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    .institution {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }

    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .intro {
      font-size: 1rem;
      color: var(--text-muted);
      max-width: 740px;
    }

    .widgets-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .card {
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      border-color: var(--card-hover-border);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.04);
    }

    .card-thumb {
      height: 125px;
      background-color: var(--card-thumb-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-thumb svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .card-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      transition: color 0.15s ease;
    }

    .card:hover .card-title {
      color: var(--link);
    }

    .card-desc {
      font-size: 0.86rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
  </style>
</head>

        </svg>
      `,
      generic: `
        <svg viewBox="0 0 260 125" xmlns="http://www.w3.org/2000/svg">
          <rect width="100%" height="100%" fill="#fafafa"/>
          <circle cx="130" cy="62" r="30" fill="none" stroke="#d1d5db" stroke-width="1.5"/>
          <line x1="85" y1="62" x2="175" y2="62" stroke="#d1d5db" stroke-width="1.5"/>
          <line x1="130" y1="20" x2="130" y2="105" stroke="#d1d5db" stroke-width="1.5"/>
        </svg>
      `
    };

    let allWidgets = [...BASELINE_WIDGETS];
    const grid = document.getElementById('widgetsGrid');

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function render() {
      grid.innerHTML = allWidgets.map(w => {
        const thumb = THUMBNAILS[w.icon] || THUMBNAILS.generic;
        return `
          <a class="card" href="widgets/${encodeURIComponent(w.filename)}">
            <div class="card-thumb">
              ${thumb}
            </div>
            <div class="card-body">
              <h2 class="card-title">${escapeHtml(w.title)}</h2>
              <p class="card-desc">${escapeHtml(w.description)}</p>
            </div>
          </a>
        `;
      }).join('');
    }

    render();
  </script>
</body>

</html>
